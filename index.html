<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade de Jogos - Index</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a24;
            --primary-color: #9d4edd;
            --hover-color: #c77dff;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
        }

        /* Barra de Pesquisa */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 2px solid var(--primary-color);
            background-color: var(--card-bg);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.2);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
            background-color: #22222e;
        }

        /* Grid de Jogos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Cartão do Jogo */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            border: 2px solid #333;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(157, 78, 221, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .game-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.4);
            color: #fff;
        }

        .game-card:hover::before {
            transform: translateX(100%);
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1;
        }

        .game-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            z-index: 1;
        }

        /* Mensagem de "Nenhum jogo encontrado" */
        #no-results {
            display: none;
            color: #888;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-color); }
    </style>
</head>
<body>

    <h1>🎮 Game Hub</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Pesquisar jogo...">
    </div>

    <div class="games-grid" id="gamesGrid">
        <!-- Os jogos serão inseridos aqui pelo JavaScript para ficar mais organizado -->
    </div>
    
    <p id="no-results">Nenhum jogo encontrado com esse nome. 😢</p>

    <script>
        // Lista de jogos (Pasta: Nome de exibição)
        // Se precisar adicionar mais jogos, basta copiar uma linha e alterar.
        const games = [
            { folder: "amanda-the-adventurer", name: "Amanda The Adventurer" },
            { folder: "andys-apple-farm", name: "Andy's Apple Farm" },
            { folder: "baldi-plus", name: "Baldi's Basics Plus" },
            { folder: "baldi-remaster", name: "Baldi Remaster" },
            { folder: "bendy", name: "Bendy and the Ink Machine" },
            { folder: "bergentruck", name: "Bergentruck" },
            { folder: "bloodmoney", name: "Blood Money" },
            { folder: "buckshot-roulette", name: "Buckshot Roulette" },
            { folder: "class-of-09", name: "Class of '09" },
            { folder: "cuphead", name: "Cuphead" },
            { folder: "dead-plate", name: "Dead Plate" },
            { folder: "deadseat", name: "Dead Seat" },
            { folder: "deltatraveler", name: "DeltaTraveler" },
            { folder: "donottakethiscathome", name: "Don't Take This Cat Home" },
            { folder: "fears-to-fathom/home-alone", name: "Fears to Fathom: Home Alone" }, // Subpasta
            { folder: "getting-over-it", name: "Getting Over It" },
            { folder: "happy-sheepies", name: "Happy Sheepies" },
            { folder: "hotline-miami", name: "Hotline Miami" },
            { folder: "human-expenditure-program", name: "Human Expenditure Program" },
            { folder: "jelly-drift", name: "Jelly Drift" },
            { folder: "karlson", name: "Karlson" },
            { folder: "kindergarten", name: "Kindergarten" },
            { folder: "lacysflashgames", name: "Lacy's Flash Games" },
            { folder: "milkman-karlson", name: "Milkman Karlson" },
            { folder: "minesweeperplus", name: "Minesweeper Plus" },
            { folder: "omori-fixed", name: "OMORI" },
            { folder: "people-playground", name: "People Playground" },
            { folder: "pizza-tower", name: "Pizza Tower" },
            { folder: "raft", name: "Raft" },
            { folder: "repo", name: "R.E.P.O." },
            { folder: "schoolboy-runaway", name: "Schoolboy Runaway" },
            { folder: "slender", name: "Slender" },
            { folder: "sonic.exe", name: "Sonic.exe" },
            { folder: "speed-stars", name: "Speed Stars" },
            { folder: "tattletail", name: "Tattletail" },
            { folder: "thats-not-my-neighbor", name: "That's Not My Neighbor" },
            { folder: "the-man-in-the-window", name: "The Man in the Window" },
            { folder: "ultrakill", name: "ULTRAKILL" },
            { folder: "undertale-yellow", name: "Undertale Yellow" },
            { folder: "web-fishing", name: "Web Fishing" },
            { folder: "witch-heart", name: "Witch's Heart" },
            { folder: "yandere-simulator", name: "Yandere Simulator" },
            // Caso Yume Nikki seja um arquivo solto (yume-nikki.html) e não uma pasta, mude o final da linha abaixo para: { folder: "yume-nikki.html", name: "Yume Nikki" }
            { folder: "yume-nikki", name: "Yume Nikki" }
        ];

        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('no-results');

        // Função para renderizar os jogos
        function renderGames(filter = "") {
            grid.innerHTML = '';
            let count = 0;

            games.forEach(game => {
                // Verifica se o nome do jogo inclui o que foi digitado na pesquisa
                if (game.name.toLowerCase().includes(filter.toLowerCase())) {
                    const link = document.createElement('a');
                    // Link aponta para a pasta do jogo + /index.html
                    link.href = `${game.folder}/index.html`;
                    link.className = 'game-card';
                    
                    link.innerHTML = `
                        <div class="game-icon">🕹️</div>
                        <div class="game-title">${game.name}</div>
                    `;
                    
                    grid.appendChild(link);
                    count++;
                }
            });

            // Mostra aviso se não encontrar nada
            if (count === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }

        // Evento de digitar na barra de pesquisa
        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        // Renderiza a lista inicial ao carregar a página
        renderGames();
    </script>
</body>
</html>
